<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taka Tracker</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="app">
            <div class="app-header">
                <h1 class="app-title">Taka Tracker</h1>
                <p class="app-subtitle">Track your finances effortlessly</p>
            </div>

            <div class="balance-section">
                <div class="balance-card">
                    <p class="balance-title">Current Balance</p>
                    <p class="balance-amount positive">00.00 ৳</p>
                </div>
                <div class="balance-card">
                    <p class="balance-title">Total Income</p>
                    <p class="balance-amount positive">00.00 ৳</p>
                </div>
            </div>

            <div class="transactions-section">
                <h2 class="section-title">Transaction History</h2>
                <ul class="transaction-list" id="transactionList">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                        <p>No transactions yet</p>
                        <p>Add your first transaction to get started</p>
                    </div>
                </ul>
            </div>

            <div class="add-transaction">
                <div style="display: flex; align-items: center;">
                    <h2 class="section-title">Add Transaction</h2>
                    <button class="toggle-btn" id="toggleFormBtn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <div class="form-container" id="transactionForm">
                    <div class="form-group">
                        <label for="transactionName" class="form-label">Transaction Name</label>
                        <input type="text" id="transactionName" class="form-input" placeholder="e.g. Groceries, Salary">
                    </div>
                    <div class="form-group">
                        <label for="transactionAmount" class="form-label">Amount (৳)</label>
                        <input type="number" id="transactionAmount" class="form-input" placeholder="0.00">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="addIncomeBtn">
                            <i class="fas fa-plus-circle"></i> Add Income
                        </button>
                        <button class="btn btn-danger" id="addExpenseBtn">
                            <i class="fas fa-minus-circle"></i> Add Expense
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js">



    </script>
</body>

</html>
